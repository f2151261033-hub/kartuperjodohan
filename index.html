<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pancasila Match - Gamifikasi PPKn SMP</title>
    
    <!-- Three.js untuk WebGL Background -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a1f2e;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* WebGL Canvas Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container - Mobile View */
        .game-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: rgba(10, 30, 45, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 8px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .stats {
            display: flex;
            gap: 12px;
            font-size: 12px;
            background: rgba(255,255,255,0.08);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header .stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .header .stats .score {
            color: #ffd200;
            font-weight: 700;
        }

        /* Card Grid */
        .card-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 4px;
            align-content: center;
            perspective: 1000px;
        }

        /* Card Styles */
        .card {
            aspect-ratio: 3/4;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 12px;
            will-change: transform;
        }

        .card:active {
            transform: scale(0.95);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            animation: matchPulse 0.5s ease;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card.matched .card-face {
            border-color: #4caf50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4px;
            text-align: center;
            font-size: 9px;
            line-height: 1.2;
            border: 2px solid rgba(255,255,255,0.15);
            overflow: hidden;
            word-break: break-word;
        }

        .card-front {
            background: linear-gradient(145deg, #1a3a4a, #0d2b3a);
            transform: rotateY(0deg);
            color: rgba(255,255,255,0.2);
            font-size: 24px;
        }

        .card-front::after {
            content: '?';
            font-size: 28px;
            font-weight: 700;
            color: rgba(255,255,255,0.08);
        }

        .card-back {
            background: linear-gradient(145deg, #1e4d5e, #0f2f3d);
            transform: rotateY(180deg);
            color: #e0f0ff;
            font-weight: 500;
            padding: 6px;
            font-size: 8.5px;
            border-color: rgba(100, 200, 255, 0.2);
        }

        .card-back .sila-badge {
            font-size: 7px;
            font-weight: 700;
            color: #ffd200;
            margin-bottom: 2px;
            background: rgba(255,210,0,0.15);
            padding: 1px 6px;
            border-radius: 8px;
            display: inline-block;
        }

        .card-back .content {
            font-size: 8px;
            opacity: 0.9;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-back.symbol-card .content {
            font-size: 22px;
            -webkit-line-clamp: 2;
        }

        /* Bottom Bar */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 8px 4px;
            gap: 8px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #0a1f2e;
            box-shadow: 0 4px 15px rgba(247, 151, 30, 0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: #0a1f2e;
        }

        /* Progress Garden */
        .garden {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 4px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            min-width: 100px;
            justify-content: center;
        }

        .garden .plant {
            font-size: 18px;
            transition: all 0.3s;
            filter: grayscale(1) brightness(0.5);
            opacity: 0.4;
        }

        .garden .plant.bloom {
            filter: grayscale(0) brightness(1);
            opacity: 1;
            animation: bloom 0.6s ease;
        }

        @keyframes bloom {
            0% { transform: scale(0.3) rotate(-20deg); }
            60% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Modal / Overlay */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(145deg, #1a3a4a, #0d2b3a);
            padding: 24px;
            border-radius: 20px;
            text-align: center;
            max-width: 85%;
            border: 1px solid rgba(255,210,0,0.3);
            box-shadow: 0 0 40px rgba(255,210,0,0.2);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-content h2 {
            font-size: 22px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .modal-content p {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .badge-display {
            font-size: 56px;
            margin: 12px 0;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .badge-label {
            font-size: 14px;
            font-weight: 700;
            color: #ffd200;
            margin-bottom: 4px;
        }

        .badge-desc {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 16px;
        }

        /* Toast */
        .toast {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            z-index: 200;
            border: 1px solid rgba(255,255,255,0.1);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Confetti canvas */
        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 150;
            border-radius: 24px;
        }

        /* Responsive adjustments */
        @media (max-height: 700px) {
            .game-container { padding: 10px; }
            .card-grid { gap: 5px; }
            .card-back { font-size: 7px; }
            .card-back .content { font-size: 7px; -webkit-line-clamp: 3; }
            .card-back.symbol-card .content { font-size: 18px; }
            .header h1 { font-size: 15px; }
        }

        @media (max-width: 380px) {
            .card-grid { gap: 4px; }
            .card-back { font-size: 6.5px; }
            .card-back .content { font-size: 6.5px; -webkit-line-clamp: 3; }
            .card-back.symbol-card .content { font-size: 16px; }
            .card-back .sila-badge { font-size: 5.5px; padding: 0 4px; }
        }

        /* Scrollbar hide */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- WebGL Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Main Game -->
    <div class="game-container" id="gameContainer">
        
        <!-- Confetti -->
        <canvas id="confetti-canvas"></canvas>

        <!-- Header -->
        <div class="header">
            <h1>🕊️ Pancasila Match</h1>
            <div class="stats">
                <span>⭐ <span class="score" id="scoreDisplay">0</span></span>
                <span>🃏 <span id="pairDisplay">0/5</span></span>
            </div>
        </div>

        <!-- Card Grid -->
        <div class="card-grid" id="cardGrid"></div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="garden" id="garden">
                <span class="plant" id="plant0">🌱</span>
                <span class="plant" id="plant1">🌱</span>
                <span class="plant" id="plant2">🌱</span>
                <span class="plant" id="plant3">🌱</span>
                <span class="plant" id="plant4">🌱</span>
            </div>
            <button class="btn btn-secondary" id="resetBtn" style="flex:0.5;">🔄</button>
            <button class="btn btn-primary" id="shuffleBtn" style="flex:0.7;">Kocok</button>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>

        <!-- Modal Reward -->
        <div class="modal-overlay" id="rewardModal">
            <div class="modal-content">
                <div class="badge-display" id="badgeIcon">🏆</div>
                <div class="badge-label" id="badgeLabel">BADGE BARU!</div>
                <h2 id="modalTitle">Selamat!</h2>
                <p id="modalDesc">Kamu telah berhasil menumbuhkan tanaman dan memanen buah Pancasila!</p>
                <div class="badge-desc" id="badgeDesc">🌻 Bunga Pancasila telah berbunga & berbuah</div>
                <button class="btn btn-success" id="closeModalBtn" style="width:100%;">Lanjutkan</button>
            </div>
        </div>

    </div>

    <script>
        // ============================================
        // DATA PANCASILA - 5 SILA
        // ============================================
        const PANCASILA_DATA = [
            {
                id: 1,
                sila: "Sila ke-1",
                symbol: "⭐",
                content: "Ketuhanan Yang Maha Esa",
                desc: "Menghormati agama & kepercayaan orang lain",
                color: "#FFD700"
            },
            {
                id: 2,
                sila: "Sila ke-2",
                symbol: "🤝",
                content: "Kemanusiaan yang Adil dan Beradab",
                desc: "Menolong sesama tanpa membeda-bedakan",
                color: "#FF6B6B"
            },
            {
                id: 3,
                sila: "Sila ke-3",
                symbol: "🇮🇩",
                content: "Persatuan Indonesia",
                desc: "Cinta tanah air & rela berkorban",
                color: "#FF4444"
            },
            {
                id: 4,
                sila: "Sila ke-4",
                symbol: "🗳️",
                content: "Kerakyatan yang Dipimpin oleh Hikmat Kebijaksanaan dalam Permusyawaratan/Perwakilan",
                desc: "Musyawarah untuk mencapai mufakat",
                color: "#4ECDC4"
            },
            {
                id: 5,
                sila: "Sila ke-5",
                symbol: "⚖️",
                content: "Keadilan Sosial bagi Seluruh Rakyat Indonesia",
                desc: "Bersikap adil & menghargai karya orang lain",
                color: "#45B7D1"
            }
        ];

        // ============================================
        // GAME STATE
        // ============================================
        let gameState = {
            cards: [],
            flippedCards: [],
            matchedPairs: 0,
            score: 0,
            isLocked: false,
            plantsGrown: 0,
            totalPlants: 5,
            badgeEarned: false
        };

        // ============================================
        // LOCALSTORAGE JSON PERSISTENCE
        // ============================================
        const STORAGE_KEY = 'pancasila_match_data';

        function saveToStorage() {
            const data = {
                score: gameState.score,
                matchedPairs: gameState.matchedPairs,
                plantsGrown: gameState.plantsGrown,
                badgeEarned: gameState.badgeEarned,
                timestamp: new Date().toISOString()
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('Storage tidak tersedia:', e);
            }
        }

        function loadFromStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    gameState.score = data.score || 0;
                    gameState.matchedPairs = data.matchedPairs || 0;
                    gameState.plantsGrown = data.plantsGrown || 0;
                    gameState.badgeEarned = data.badgeEarned || false;
                    return true;
                }
            } catch (e) {
                console.warn('Gagal load storage:', e);
            }
            return false;
        }

        // ============================================
        // THREE.JS WEBGL BACKGROUND
        // ============================================
        let scene, camera, renderer, particles;

        function initWebGL() {
            const canvas = document.getElementById('bg-canvas');
            renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            // Particles
            const geometry = new THREE.BufferGeometry();
            const count = 800;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 100;
                positions[i + 1] = (Math.random() - 0.5) * 100;
                positions[i + 2] = (Math.random() - 0.5) * 60;

                const color = new THREE.Color().setHSL(
                    0.55 + Math.random() * 0.15,
                    0.8,
                    0.3 + Math.random() * 0.4
                );
                colors[i] = color.r;
                colors[i + 1] = color.g;
                colors[i + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.35,
                vertexColors: true,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Floating shapes
            const shapeGeo = new THREE.IcosahedronGeometry(0.6, 0);
            const shapeMat = new THREE.MeshBasicMaterial({
                color: 0xffd200,
                wireframe: true,
                transparent: true,
                opacity: 0.12
            });

            for (let i = 0; i < 6; i++) {
                const mesh = new THREE.Mesh(shapeGeo, shapeMat.clone());
                mesh.position.set(
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 40,
                    (Math.random() - 0.5) * 20
                );
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                mesh.userData.speed = 0.002 + Math.random() * 0.005;
                mesh.userData.offset = Math.random() * Math.PI * 2;
                scene.add(mesh);
            }

            animateWebGL();
        }

        function animateWebGL() {
            requestAnimationFrame(animateWebGL);

            const time = Date.now() * 0.0005;

            if (particles) {
                particles.rotation.y = time * 0.1;
                particles.rotation.x = Math.sin(time * 0.2) * 0.1;
            }

            scene.children.forEach(child => {
                if (child.isMesh) {
                    child.rotation.x += child.userData.speed;
                    child.rotation.y += child.userData.speed * 1.3;
                    child.position.y += Math.sin(time + child.userData.offset) * 0.008;
                }
            });

            renderer.render(scene, camera);
        }

        // ============================================
        // CARD GENERATION
        // ============================================
        function generateCards() {
            const cards = [];
            
            PANCASILA_DATA.forEach(item => {
                // Kartu Simbol
                cards.push({
                    id: `symbol-${item.id}`,
                    pairId: item.id,
                    type: 'symbol',
                    symbol: item.symbol,
                    sila: item.sila,
                    content: item.symbol,
                    color: item.color,
                    matched: false
                });
                // Kartu Teks
                cards.push({
                    id: `text-${item.id}`,
                    pairId: item.id,
                    type: 'text',
                    symbol: item.symbol,
                    sila: item.sila,
                    content: item.content,
                    desc: item.desc,
                    color: item.color,
                    matched: false
                });
            });

            return shuffleArray(cards);
        }

        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ============================================
        // RENDER CARDS
        // ============================================
        function renderCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            gameState.cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = `card ${card.matched ? 'matched flipped' : ''}`;
                cardEl.dataset.index = index;
                cardEl.dataset.pairId = card.pairId;
                cardEl.dataset.type = card.type;

                // Front (tertutup)
                const front = document.createElement('div');
                front.className = 'card-face card-front';

                // Back (terbuka)
                const back = document.createElement('div');
                back.className = `card-face card-back ${card.type === 'symbol' ? 'symbol-card' : ''}`;
                back.style.borderColor = card.color + '44';
                
                if (card.type === 'symbol') {
                    back.innerHTML = `
                        <div class="sila-badge" style="color:${card.color}">${card.sila}</div>
                        <div class="content" style="font-size:22px;">${card.symbol}</div>
                    `;
                } else {
                    back.innerHTML = `
                        <div class="sila-badge" style="color:${card.color}">${card.sila}</div>
                        <div class="content">${card.content}</div>
                    `;
                }

                cardEl.appendChild(front);
                cardEl.appendChild(back);

                cardEl.addEventListener('click', () => handleCardClick(index));

                grid.appendChild(cardEl);
            });

            updateUI();
        }

        // ============================================
        // CARD CLICK HANDLER
        // ============================================
        function handleCardClick(index) {
            if (gameState.isLocked) return;
            if (gameState.cards[index].matched) return;
            if (gameState.flippedCards.includes(index)) return;

            const cardEl = document.querySelector(`.card[data-index="${index}"]`);
            if (!cardEl) return;

            // Flip card
            cardEl.classList.add('flipped');
            gameState.flippedCards.push(index);

            // Check pair
            if (gameState.flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            gameState.isLocked = true;
            const [i1, i2] = gameState.flippedCards;
            const card1 = gameState.cards[i1];
            const card2 = gameState.cards[i2];

            // Cek apakah pairId sama DAN tipe berbeda (simbol vs teks)
            const isMatch = card1.pairId === card2.pairId && card1.type !== card2.type;

            if (isMatch) {
                // MATCH!
                setTimeout(() => {
                    card1.matched = true;
                    card2.matched = true;
                    
                    const el1 = document.querySelector(`.card[data-index="${i1}"]`);
                    const el2 = document.querySelector(`.card[data-index="${i2}"]`);
                    if (el1) el1.classList.add('matched');
                    if (el2) el2.classList.add('matched');

                    gameState.matchedPairs++;
                    gameState.score += 20;
                    gameState.plantsGrown++;
                    gameState.flippedCards = [];
                    gameState.isLocked = false;

                    // Update UI
                    updateUI();
                    showToast(`✅ Benar! ${card1.sila} - +20 poin`);
                    growPlant(gameState.plantsGrown - 1);
                    saveToStorage();

                    // Check win
                    if (gameState.matchedPairs === 5) {
                        setTimeout(() => {
                            onGameComplete();
                        }, 500);
                    }
                }, 400);
            } else {
                // TIDAK MATCH - kartu TETAP TIDAK TERBALIK (tidak flip balik)
                setTimeout(() => {
                    // Kartu tetap terbuka (tidak di-flip balik)
                    // Hanya reset state

        }

        // ============================================
        // CONFETTI
        // ============================================
        let confettiAnimationId = null;
        let confettiParticles = [];

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            confettiParticles = [];
            for (let i = 0; i < 120; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: 4 + Math.random() * 6,
                    h: 6 + Math.random() * 8,
                    color: ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#FF4444'][Math.floor(Math.random() * 5)],
                    vx: (Math.random() - 0.5) * 3,
                    vy: 2 + Math.random() * 4,
                    rot: Math.random() * Math.PI * 2,
                    vrot: (Math.random() - 0.5) * 0.2,
                    life: 1
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                confettiParticles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rot += p.vrot;
                    p.vy += 0.05;
                    p.life -= 0.003;

                    if (p.life > 0 && p.y < canvas.height + 50) {
                        alive = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.rot);
                        ctx.globalAlpha = Math.min(1, p.life * 2);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                    }
                });

                if (alive) {
                    confettiAnimationId = requestAnimationFrame(animateConfetti);
                }
            }

            animateConfetti();
        }

        function stopConfetti() {
            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
            }
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // ============================================
        // RESET GAME
        // ============================================
        function resetGame() {
            // Reset state
            gameState.cards = generateCards();
            gameState.flippedCards = [];
            gameState.matchedPairs = 0;
            gameState.score = 0;
            gameState.isLocked = false;
            gameState.plantsGrown = 0;
            gameState.badgeEarned = false;

            // Reset plants
            for (let i = 0; i < 5; i++) {
                const plant = document.getElementById(`plant${i}`);
                if (plant) {
                    plant.textContent = '🌱';
                    plant.classList.remove('bloom');
                }
            }

            // Clear storage
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}

            // Re-render
            renderCards();
            updateUI();
            showToast('🔄 Permainan direset!');
        }
